[project]
name = "devops-agent"
version = "0.1.0"
description = "Autonomous DevOps/SRE Agent with LangGraph orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangGraph for agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",

    # Pydantic v2 for typed state
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Redis for caching
    "redis>=5.0.0",
    "aioredis>=2.0.0",

    # Neo4j for service dependency graph
    "neo4j>=5.0.0",

    # PGVector for embeddings
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",

    # Kubernetes client
    "kubernetes>=30.0.0",

    # OpenTelemetry for tracing
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",

    # Prometheus metrics
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=6.1.0",

    # FastAPI for API layer
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",

    # HTTP client
    "httpx>=0.27.0",

    # Configuration
    "pyyaml>=6.0.0",

    # Logging
    "structlog>=24.0.0",

    # Async utilities
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
