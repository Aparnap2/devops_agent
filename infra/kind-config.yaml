# Kind cluster configuration for SRE Agent demo
# Exposes ports for Prometheus, Alertmanager, Grafana, and demo app
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-agent

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Prometheus
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      # Alertmanager
      - containerPort: 30093
        hostPort: 9093
        protocol: TCP
      # Grafana
      - containerPort: 30030
        hostPort: 3000
        protocol: TCP
      # Demo app
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Chaos Mesh dashboard
      - containerPort: 31333
        hostPort: 2333
        protocol: TCP
  - role: worker
  - role: worker

# Enable audit logging for observability
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        audit-log-path: /var/log/kubernetes/audit.log
        audit-log-maxage: "7"
        audit-log-maxbackup: "3"
        audit-log-maxsize: "10"
